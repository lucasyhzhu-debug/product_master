name: Refresh K3Mart Token

on:
  schedule:
    # Daily at 20:00 UTC (03:00 WIB)
    - cron: '0 20 * * *'
  workflow_dispatch:
    # Manual trigger from GitHub Actions UI

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Refresh K3Mart Token
        env:
          K3MART_EMAIL: ${{ secrets.K3MART_EMAIL }}
          K3MART_PASSWORD: ${{ secrets.K3MART_PASSWORD }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npm run refresh-k3mart-token

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k3mart-debug-screenshots
          path: scripts/debug-screenshots/
          retention-days: 7
