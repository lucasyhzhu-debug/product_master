name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_convex:
        description: 'Deploy Convex backend'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      deploy_vercel:
        description: 'Trigger Vercel frontend deploy'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
  # Pre-merge gate: run lint + build on every PR targeting main.
  # Deploy jobs are gated on `github.event_name != 'pull_request'` so
  # they never fire on PR context.
  pull_request:
    branches: [main]

jobs:
  # Job 1: Lint check for forbidden patterns (always runs if workflow triggers)
  lint-convex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden dynamic imports
        run: |
          echo "Checking for dynamic imports in convex/ directory..."
          if grep -rE "await\s+import\s*\(" convex/ --include="*.ts"; then
            echo "ERROR: Dynamic imports found in Convex code!"
            echo "Dynamic import() is not supported in the Convex runtime."
            echo "Use static imports at the top of the file instead."
            exit 1
          fi
          echo "No dynamic imports found"

  # Job 1b: Build frontend (tsc -b + vite build) — gates BOTH Convex deploy and Vercel trigger.
  # Vercel runs the same command at deploy time, but by then Convex has already shipped.
  # This job lets us catch frontend regressions before split-brain (Convex ahead, Vercel broken).
  # NOTE: `npm run build` now also runs `tsc -p convex/tsconfig.json --noEmit` so convex
  # type errors (including in convex/**/__tests__/) fail the gate pre-merge instead of at
  # deploy time. Reproduces the exact typecheck the Convex deploy runs.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend + convex typecheck (tsc + vite)
        run: npm run build

  # Job 1c: Run the test suite (vitest). Gates deploy + Vercel just like build-frontend.
  # Convex test files are NOT covered by the frontend tsc; vitest runs them, which is the
  # second layer of catching the convex-test-file class of bug that split-brained twice
  # (PR #140/#142, PR #163/#164).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test

  # Job 2: Check if Convex files changed
  check-convex-changes:
    runs-on: ubuntu-latest
    # Skip on PR — only needed to gate deploy-convex, which doesn't run on PRs.
    if: github.event_name != 'pull_request'
    outputs:
      convex_changed: ${{ steps.check.outputs.convex_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Convex changes
        id: check
        run: |
          # For manual trigger, use the input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.deploy_convex }}" == "true" ]; then
              echo "convex_changed=true" >> $GITHUB_OUTPUT
              echo "✅ Manual trigger with deploy_convex=true"
            else
              echo "convex_changed=false" >> $GITHUB_OUTPUT
              echo "⏭️ Manual trigger with deploy_convex=false"
            fi
            exit 0
          fi

          # Diff convex/ against the LAST COMMIT ACTUALLY DEPLOYED to Convex,
          # tracked by the `convex-deployed` marker tag (advanced by deploy-convex
          # after every successful prod deploy). This is drift-based, not push-based:
          # if a convex/ change ever lands on main without being deployed (e.g. its
          # push failed the test gate so deploy-convex was skipped), EVERY subsequent
          # push still sees the drift and re-triggers the deploy until the marker
          # catches up. The old before→after push-range diff lost that delta forever.
          # See memory/lesson_convex_deploy_marker_drift.md.
          AFTER="${{ github.sha }}"
          git fetch --no-tags origin '+refs/tags/convex-deployed:refs/tags/convex-deployed' 2>/dev/null || true

          if git rev-parse -q --verify refs/tags/convex-deployed >/dev/null; then
            BASE=$(git rev-parse refs/tags/convex-deployed)
            echo "Comparing convex/ against last-deployed marker: $BASE → $AFTER"
            CHANGED_FILES=$(git diff --name-only "$BASE" "$AFTER")
          else
            # No marker yet (first run after introducing it) — fall back to the push
            # range so behaviour is unchanged until the first deploy seeds the marker.
            BEFORE="${{ github.event.before }}"
            echo "No convex-deployed marker — falling back to push range: $BEFORE → $AFTER"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
            else
              CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER")
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if any convex/ files changed
          if echo "$CHANGED_FILES" | grep -q '^convex/'; then
            echo "convex_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Convex files changed - will deploy"
          else
            echo "convex_changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ No Convex files changed - skipping deploy"
          fi

  # Job 2b: Split-brain guard — when this push doesn't touch convex/ (so deploy-convex
  # will be skipped), prove the deployed Convex backend is actually in sync with main
  # before letting Vercel ship on top of it. We assert directly that main's convex/
  # tree equals the `convex-deployed` marker (the last SHA actually deployed). This is
  # strictly stronger than the old "was the previous deploy-convex job a failure?"
  # check, which had a blind spot: a convex-carrying push whose deploy-convex was
  # SKIPPED (gated out by a failing test) left convex/ undeployed on main, but the
  # job conclusion was "skipped" (not "failure"), so the guard waved it through and
  # Vercel shipped on a stale backend (hit live 2026-06-29; earlier splitbrains
  # 2026-04-16 + 2026-05-22, see memory/lesson_convex_vercel_splitbrain.md +
  # memory/lesson_convex_deploy_marker_drift.md).
  previous-deploy-health-check:
    runs-on: ubuntu-latest
    needs: [check-convex-changes]
    if: github.event_name == 'push' && needs.check-convex-changes.outputs.convex_changed == 'false'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert convex/ on main matches the deployed marker (no drift)
        run: |
          git fetch --no-tags origin '+refs/tags/convex-deployed:refs/tags/convex-deployed' 2>/dev/null || true
          if ! git rev-parse -q --verify refs/tags/convex-deployed >/dev/null; then
            echo "::warning::No convex-deployed marker yet — cannot verify sync; allowing (marker seeds on first deploy)."
            exit 0
          fi
          BASE=$(git rev-parse refs/tags/convex-deployed)
          echo "Deployed marker: $BASE ; main HEAD: ${{ github.sha }}"
          if git diff --quiet "$BASE" "${{ github.sha }}" -- convex/; then
            echo "✅ convex/ on main matches the deployed backend — safe to ship Vercel alone."
          else
            echo "::error::convex/ on main DIFFERS from the deployed backend (marker $BASE)."
            echo "::error::An undeployed Convex change is on main — shipping Vercel now would split-brain."
            echo "::error::Run the Deploy workflow manually (Actions → Deploy → Run workflow, deploy_convex=true) to deploy Convex and advance the marker, then re-run."
            git diff --name-only "$BASE" "${{ github.sha }}" -- convex/ | sed 's/^/  drifted: /'
            exit 1
          fi

  # Job 3: Deploy Convex (only if convex files changed, and never on PRs)
  deploy-convex:
    runs-on: ubuntu-latest
    needs: [lint-convex, build-frontend, test, check-convex-changes]
    if: github.event_name != 'pull_request' && needs.check-convex-changes.outputs.convex_changed == 'true'
    # Needs write access to advance the `convex-deployed` marker tag after deploy.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Convex Production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes

      - name: Advance the convex-deployed marker
        # Point the marker at the just-deployed SHA so the next run's drift check
        # (check-convex-changes) compares against what is actually live on Convex.
        # Only on real pushes to main — a workflow_dispatch may deploy an arbitrary
        # ref and should not move the main-tracking marker.
        if: github.event_name == 'push'
        run: |
          git tag -f convex-deployed "${{ github.sha }}"
          git push -f origin "refs/tags/convex-deployed"

  # Job 4: Trigger Vercel (waits for Convex to complete first)
  trigger-vercel:
    runs-on: ubuntu-latest
    needs: [lint-convex, build-frontend, test, check-convex-changes, deploy-convex, previous-deploy-health-check]
    # Run if: lint + frontend build + tests pass, AND either deploy-convex succeeded on this
    # push OR it skipped AND the previous deploy-convex on main was healthy (split-brain guard).
    if: |
      always() &&
      needs.lint-convex.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      needs.test.result == 'success' &&
      (
        needs.deploy-convex.result == 'success' ||
        (needs.deploy-convex.result == 'skipped' && (
          needs.previous-deploy-health-check.result == 'success' ||
          github.event_name == 'workflow_dispatch'
        ))
      ) &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_vercel == 'true') ||
        github.event_name == 'push'
      )
    steps:
      - name: Trigger Vercel Deployment
        run: |
          echo "Triggering Vercel deployment..."
          RESPONSE=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel response: $RESPONSE"

          # Check if response contains a job ID (successful trigger)
          if echo "$RESPONSE" | grep -q '"id"'; then
            JOB_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
            echo "✅ Vercel deployment triggered successfully!"
            echo "Job ID: $JOB_ID"
          else
            echo "❌ Failed to trigger Vercel deployment"
            echo "Response: $RESPONSE"
            exit 1
          fi
