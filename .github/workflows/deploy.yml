name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_convex:
        description: 'Deploy Convex backend'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      deploy_vercel:
        description: 'Trigger Vercel frontend deploy'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
  # Pre-merge gate: run lint + build on every PR targeting main.
  # Deploy jobs are gated on `github.event_name != 'pull_request'` so
  # they never fire on PR context.
  pull_request:
    branches: [main]

jobs:
  # Job 1: Lint check for forbidden patterns (always runs if workflow triggers)
  lint-convex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden dynamic imports
        run: |
          echo "Checking for dynamic imports in convex/ directory..."
          if grep -rE "await\s+import\s*\(" convex/ --include="*.ts"; then
            echo "ERROR: Dynamic imports found in Convex code!"
            echo "Dynamic import() is not supported in the Convex runtime."
            echo "Use static imports at the top of the file instead."
            exit 1
          fi
          echo "No dynamic imports found"

  # Job 1b: Build frontend (tsc -b + vite build) — gates BOTH Convex deploy and Vercel trigger.
  # Vercel runs the same command at deploy time, but by then Convex has already shipped.
  # This job lets us catch frontend regressions before split-brain (Convex ahead, Vercel broken).
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

  # Job 2: Check if Convex files changed
  check-convex-changes:
    runs-on: ubuntu-latest
    # Skip on PR — only needed to gate deploy-convex, which doesn't run on PRs.
    if: github.event_name != 'pull_request'
    outputs:
      convex_changed: ${{ steps.check.outputs.convex_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Convex changes
        id: check
        run: |
          # For manual trigger, use the input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.deploy_convex }}" == "true" ]; then
              echo "convex_changed=true" >> $GITHUB_OUTPUT
              echo "✅ Manual trigger with deploy_convex=true"
            else
              echo "convex_changed=false" >> $GITHUB_OUTPUT
              echo "⏭️ Manual trigger with deploy_convex=false"
            fi
            exit 0
          fi

          # For push events, diff the full push range (before → after SHA).
          # HEAD~1 only sees the last commit; this captures all commits in the push
          # including fast-forward merges of multiple commits from a feature branch.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # github.event.before is all-zeros on a branch's first push — fall back to HEAD~1
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          echo "Diff range: $BEFORE → $AFTER"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if any convex/ files changed
          if echo "$CHANGED_FILES" | grep -q '^convex/'; then
            echo "convex_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Convex files changed - will deploy"
          else
            echo "convex_changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ No Convex files changed - skipping deploy"
          fi

  # Job 3: Deploy Convex (only if convex files changed, and never on PRs)
  deploy-convex:
    runs-on: ubuntu-latest
    needs: [lint-convex, build-frontend, check-convex-changes]
    if: github.event_name != 'pull_request' && needs.check-convex-changes.outputs.convex_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Convex Production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes

  # Job 4: Trigger Vercel (waits for Convex to complete first)
  trigger-vercel:
    runs-on: ubuntu-latest
    needs: [lint-convex, build-frontend, check-convex-changes, deploy-convex]
    # Run if: lint + frontend build pass, convex either succeeds or skips, and vercel deploy is requested
    if: |
      always() &&
      needs.lint-convex.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      (needs.deploy-convex.result == 'success' || needs.deploy-convex.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_vercel == 'true') ||
        github.event_name == 'push'
      )
    steps:
      - name: Trigger Vercel Deployment
        run: |
          echo "Triggering Vercel deployment..."
          RESPONSE=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel response: $RESPONSE"

          # Check if response contains a job ID (successful trigger)
          if echo "$RESPONSE" | grep -q '"id"'; then
            JOB_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
            echo "✅ Vercel deployment triggered successfully!"
            echo "Job ID: $JOB_ID"
          else
            echo "❌ Failed to trigger Vercel deployment"
            echo "Response: $RESPONSE"
            exit 1
          fi
